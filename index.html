<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Raiana! ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Montserrat:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-1: #120822;
            --bg-2: #240f36;
            --pink: #ff6b9d;
            --rose: #ff9ebb;
            --gold: #ffd166;
            --lavender: #cdb4db;
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at 20% 20%, var(--bg-2), var(--bg-1) 75%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .hidden { display: none !important; }

        /* Парящие сердечки и искорки на фоне */
        #ambient-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .float-heart {
            position: absolute;
            bottom: -40px;
            opacity: 0;
            animation: floatUp linear infinite;
            user-select: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.45; }
            85% { opacity: 0.35; }
            100% { transform: translateY(-110vh) rotate(25deg) scale(1.1); opacity: 0; }
        }

        /* =========================================
           ВХОДНОЕ ШОУ С САЛЮТАМИ И НАДПИСЬЮ
           ========================================= */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1d0c30 0%, #07030f 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 1.5s ease, visibility 1.5s ease;
        }

        #intro-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #fireworks-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .intro-text-wrap {
            position: relative;
            z-index: 2;
            animation: popInText 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes popInText {
            0% { opacity: 0; transform: scale(0.75) translateY(20px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .intro-sub {
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--rose);
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .intro-title {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2.6rem, 8vw, 5.2rem);
            background: linear-gradient(135deg, #fff 15%, #ff9ebb 50%, #ffd166 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 107, 157, 0.55);
            line-height: 1.2;
            padding: 10px;
        }

        /* =========================================
           ОБЩИЙ КОНТЕЙНЕР СТРАНИЦ
           ========================================= */
        #app-wrapper {
            position: relative;
            z-index: 2;
            max-width: 720px;
            margin: 0 auto;
            padding: 36px 18px 120px;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        #app-wrapper.visible {
            opacity: 1;
        }

        .page-view {
            animation: pageFade 0.55s ease;
        }

        @keyframes pageFade {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .music-btn, .nav-small-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.25s;
        }
        .music-btn:hover, .nav-small-btn:hover { background: rgba(255, 107, 157, 0.25); }

        .date-pill {
            font-size: 0.78rem;
            color: var(--rose);
            background: rgba(255, 107, 157, 0.14);
            padding: 7px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 107, 157, 0.35);
            font-weight: 600;
        }

        .hero-header {
            text-align: center;
            margin-bottom: 34px;
        }

        .hero-header h1 {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2.1rem, 6vw, 3.3rem);
            background: linear-gradient(135deg, #fff 20%, var(--rose) 60%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .hero-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.96rem;
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .section-card {
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            padding: 28px 24px;
            margin-bottom: 24px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 12px;
            text-align: center;
        }

        .section-sub {
            text-align: center;
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.74);
            margin-bottom: 18px;
            line-height: 1.55;
        }

        .cute-btn {
            background: linear-gradient(135deg, #ff6b9d, #9d4edd);
            color: #fff;
            border: none;
            padding: 13px 26px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(255, 107, 157, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .cute-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(255, 107, 157, 0.55);
        }

        /* =========================================
           СТРАНИЦА 1: КОНВЕРТ, ТОРТ, КОМПЛИМЕНТЫ
           ========================================= */
        .envelope-box {
            background: linear-gradient(145deg, rgba(255, 107, 157, 0.16), rgba(123, 44, 191, 0.16));
            border: 1px dashed rgba(255, 158, 187, 0.5);
            border-radius: 22px;
            padding: 26px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .envelope-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(255, 107, 157, 0.2);
        }

        .envelope-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 8px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .letter-content {
            text-align: left;
            line-height: 1.75;
            font-size: 0.96rem;
            color: rgba(255, 255, 255, 0.92);
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            animation: fadeInLetter 0.6s ease;
        }

        @keyframes fadeInLetter {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cake-area { text-align: center; padding: 6px 0; }

        .cake-visual {
            position: relative;
            width: 170px;
            height: 120px;
            margin: 34px auto 18px;
            cursor: pointer;
        }

        .cake-tier-top {
            width: 120px;
            height: 45px;
            background: linear-gradient(90deg, #ff9ebb, #ff6b9d);
            border-radius: 14px 14px 4px 4px;
            margin: 0 auto;
            position: relative;
            box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12);
        }

        .cake-tier-bottom {
            width: 165px;
            height: 55px;
            background: linear-gradient(90deg, #cdb4db, #a275c7);
            border-radius: 14px 14px 18px 18px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.35);
        }

        .candles {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
        }

        .candle {
            width: 8px;
            height: 28px;
            background: repeating-linear-gradient(45deg, #fff, #fff 4px, #ffd166 4px, #ffd166 8px);
            border-radius: 4px;
            position: relative;
        }

        .flame {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 15px;
            background: radial-gradient(circle, #fff 10%, #ffd166 55%, #ff5400 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 14px #ffd166, 0 0 24px #ff6b9d;
            animation: flicker 0.35s infinite alternate;
            transition: opacity 0.4s, transform 0.4s;
        }

        .flame.blown { opacity: 0; transform: translateX(-50%) scale(0); }

        @keyframes flicker {
            from { transform: translateX(-50%) scale(0.95) rotate(-3deg); }
            to { transform: translateX(-50%) scale(1.08) rotate(3deg); }
        }

        .compliment-display {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 16px 20px;
            margin-bottom: 16px;
            font-size: 0.96rem;
            color: #ffe5ec;
            line-height: 1.5;
            text-align: center;
        }

        /* Карточка перехода на 2-ю страницу */
        .next-page-banner {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.22), rgba(255, 209, 102, 0.16));
            border: 1px solid rgba(255, 209, 102, 0.4);
            border-radius: 26px;
            padding: 28px 22px;
            text-align: center;
            margin-top: 12px;
        }

        /* =========================================
           СТРАНИЦА 2: ПЕЧЕНЬЕ, КАПСУЛА, ОТЗЫВ
           ========================================= */
        /* 1. Печенье с предсказанием */
        .cookie-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }

        .cookie-visual {
            position: relative;
            width: 160px;
            height: 110px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            user-select: none;
        }

        .cookie-half {
            font-size: 4.4rem;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
        }

        .cookie-visual.cracked .cookie-left {
            transform: translateX(-34px) rotate(-24deg);
        }
        .cookie-visual.cracked .cookie-right {
            transform: translateX(34px) rotate(24deg);
        }

        .fortune-slip {
            background: linear-gradient(90deg, #fff8eb, #fffdf9, #fff8eb);
            color: #3b1c4a;
            border-left: 4px solid #ff6b9d;
            border-right: 4px solid #ff6b9d;
            padding: 14px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.92rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            margin-bottom: 16px;
            animation: slipExpand 0.55s ease;
        }

        @keyframes slipExpand {
            from { opacity: 0; transform: scaleX(0.3); }
            to { opacity: 1; transform: scaleX(1); }
        }

        /* 2. Капсула времени */
        .capsule-input {
            width: 100%;
            min-height: 95px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            padding: 14px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            margin-bottom: 14px;
            outline: none;
        }
        .capsule-input:focus {
            border-color: var(--gold);
        }

        .sealed-scroll {
            background: linear-gradient(145deg, #2d163d, #1c0c2b);
            border: 2px solid rgba(255, 209, 102, 0.55);
            border-radius: 22px;
            padding: 24px 20px;
            position: relative;
            text-align: center;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
            animation: fadeInLetter 0.6s ease;
        }

        .wax-seal {
            width: 52px;
            height: 52px;
            background: radial-gradient(circle at 30% 30%, #ff5c8a, #b51748);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 14px rgba(255, 77, 121, 0.5);
            border: 2px dashed rgba(255, 255, 255, 0.35);
        }

        .scroll-text {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.35rem;
            color: #ffe8f0;
            line-height: 1.5;
            margin: 12px 0;
        }

        /* 3. Отзыв на поздравление */
        .hearts-rating {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .rate-heart {
            font-size: 2rem;
            cursor: pointer;
            filter: grayscale(1) opacity(0.45);
            transition: transform 0.2s, filter 0.2s;
            user-select: none;
        }

        .rate-heart.active {
            filter: grayscale(0) opacity(1);
            transform: scale(1
