<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретное послание ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #0b0719;
            --accent-1: #ff4d8d;
            --accent-2: #7b2cbf;
            --accent-3: #ffd166;
            --glass: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at top right, #1f1135, var(--bg-dark) 60%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(110px);
            z-index: 0;
            opacity: 0.45;
            pointer-events: none;
        }
        .glow-1 { background: var(--accent-1); top: -80px; left: -80px; }
        .glow-2 { background: var(--accent-2); bottom: -80px; right: -80px; }

        .container {
            position: relative;
            z-index: 1;
            max-width: 560px;
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden { display: none !important; }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 50px;
            background: rgba(255, 77, 141, 0.18);
            border: 1px solid rgba(255, 77, 141, 0.4);
            color: #ff85b3;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            line-height: 1.2;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 30%, #ffd166 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.65;
            font-size: 0.98rem;
            margin-bottom: 24px;
        }

        /* Таймер */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 28px 0;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 8px;
        }

        .time-val {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-3);
            display: block;
        }

        .time-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 4px;
            display: block;
        }

        /* Карточки внутри поздравления */
        .wishes-list {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 24px 0;
        }

        .wish-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s;
        }

        .wish-item:hover {
            transform: translateX(4px);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 77, 141, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 77, 141, 0.5);
        }

        .expire-note {
            margin-top: 22px;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.45);
        }

        /* Скрытая кнопка теста для тебя */
        .dev-preview {
            margin-top: 20px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            cursor: pointer;
        }
        .dev-preview:hover { color: rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- ЭКРАН 1: ДО 7 ДЕКАБРЯ -->
    <div id="screen-locked" class="container hidden">
        <div class="badge">Доступ ограничен по времени</div>
        <h1>Твой сюрприз уже в пути ✨</h1>
        <p>Эта страница
