<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Raiana! ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Montserrat:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-1: #120822;
            --bg-2: #240f36;
            --pink: #ff6b9d;
            --rose: #ff9ebb;
            --gold: #ffd166;
            --lavender: #cdb4db;
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at 20% 20%, var(--bg-2), var(--bg-1) 75%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .hidden { display: none !important; }

        /* Парящие сердечки и искорки на фоне */
        #ambient-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .float-heart {
            position: absolute;
            bottom: -40px;
            opacity: 0;
            animation: floatUp linear infinite;
            user-select: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.45; }
            85% { opacity: 0.35; }
            100% { transform: translateY(-110vh) rotate(25deg) scale(1.1); opacity: 0; }
        }

        /* =========================================
           ВХОДНОЕ ШОУ С САЛЮТАМИ И НАДПИСЬЮ
           ========================================= */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1d0c30 0%, #07030f 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 1.5s ease, visibility 1.5s ease;
        }

        #intro-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #fireworks-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .intro-text-wrap {
            position: relative;
            z-index: 2;
            animation: popInText 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes popInText {
            0% { opacity: 0; transform: scale(0.75) translateY(20px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .intro-sub {
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--rose);
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .intro-title {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2.6rem, 8vw, 5.2rem);
            background: linear-gradient(135deg, #fff 15%, #ff9ebb 50%, #ffd166 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 107, 157, 0.55);
            line-height: 1.2;
            padding: 10px;
        }

        /* =========================================
           ОБЩИЙ КОНТЕЙНЕР СТРАНИЦ
           ========================================= */
        #app-wrapper {
            position: relative;
            z-index: 2;
            max-width: 720px;
            margin: 0 auto;
            padding: 36px 18px 120px;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        #app-wrapper.visible {
            opacity: 1;
        }

        .page-view {
            animation: pageFade 0.55s ease;
        }

        @keyframes pageFade {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .music-btn, .nav-small-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.25s;
        }
